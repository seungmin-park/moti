name: PR Bot

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: pr-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-bot:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      REPO: ${{ github.repository }}
      PRIMARY_MODEL: ${{ vars.PR_BOT_MODEL || 'fable' }}
      FALLBACK_MODEL: ${{ vars.PR_BOT_FALLBACK_MODEL || 'opus' }}
      THREADS_QUERY: >-
        query($owner:String!,$repo:String!,$pr:Int!){
        repository(owner:$owner,name:$repo){pullRequest(number:$pr){
        reviewThreads(first:100){nodes{isResolved path line
        comments(first:10){nodes{author{login} body}}}}}}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare review state
        id: state
        run: |
          set -euo pipefail
          mkdir -p .pr-bot
          echo '.pr-bot/' >> .git/info/exclude

          # 리뷰어 지침은 base의 것을 쓴다. base에 없을 때만 PR의 것을 쓴다.
          SKILL=.claude/skills/pr-bot/SKILL.md
          if git cat-file -e "origin/$BASE_REF:$SKILL" 2>/dev/null; then
            git show "origin/$BASE_REF:$SKILL" > .pr-bot/instructions.md
          else
            cp "$SKILL" .pr-bot/instructions.md
          fi

          gh api graphql -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$PR" -f query="$THREADS_QUERY" \
            --jq '.data.repository.pullRequest.reviewThreads.nodes' > .pr-bot/threads.json

          LAST=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-bot:summary"))) | {id, body}' | tail -n 1)
          COMMENT_ID=$(jq -r '.id // empty' <<<"${LAST:-{\}}")
          MARKER=$(jq -r '.body // ""' <<<"${LAST:-{\}}" | head -n 1)
          LAST_SHA=$(sed -nE 's/.*head=([0-9a-f]{40}).*/\1/p' <<<"$MARKER")
          LAST_ROUND=$(sed -nE 's/.*round=([0-9]+).*/\1/p' <<<"$MARKER")
          # 상한에 걸린 head는 리뷰되지 않았으므로 마지막으로 실제 리뷰한 커밋을 따로 기록한다.
          REVIEWED=$(sed -nE 's/.*reviewed=([0-9a-f]{40}).*/\1/p' <<<"$MARKER")
          REVIEWED=${REVIEWED:-$LAST_SHA}

          # 닫힌 상한 스레드 하나마다 3라운드를 더 준다.
          RESOLVED_CAPS=$(jq '[.[] | select(.isResolved and (.comments.nodes[0].body | startswith("**[사람 확인 필요]** 리뷰 라운드 상한")))] | length' .pr-bot/threads.json)
          LIMIT=$((3 * (RESOLVED_CAPS + 1)))

          patch_id() {
            git diff "$(git merge-base "origin/$BASE_REF" "$1")" "$1" | git patch-id --stable | cut -d' ' -f1
          }

          is_ancestor() {
            git cat-file -e "$REVIEWED^{commit}" 2>/dev/null && git merge-base --is-ancestor "$REVIEWED" "$HEAD_SHA"
          }

          # 지난 리뷰 이후 커밋이 충돌 해결 없는 base 머지뿐인지 본다.
          only_clean_base_merges() {
            [ -z "$(git rev-list --no-merges "$REVIEWED..$HEAD_SHA" "^origin/$BASE_REF")" ] || return 1
            local merge resolution
            for merge in $(git rev-list --merges "$REVIEWED..$HEAD_SHA" "^origin/$BASE_REF"); do
              # 판정 실패는 깨끗한 머지로 보지 않는다. 이어지는 diff 생성도 실패하면 job이 실패한다.
              resolution=$(git show --remerge-diff --format= "$merge") || return 1
              [ -z "$resolution" ] || return 1
            done
          }

          # base에서 들어온 변경을 빼고 PR의 새 변경만 남긴다.
          write_new_changes() {
            local commit
            for commit in $(git rev-list --reverse --no-merges "$REVIEWED..$HEAD_SHA" "^origin/$BASE_REF"); do
              git show --format='commit %H%n%s' "$commit"
            done
            for commit in $(git rev-list --reverse --merges "$REVIEWED..$HEAD_SHA" "^origin/$BASE_REF"); do
              git show --remerge-diff --format='merge %H' "$commit"
            done
          }

          MODE=review
          ROUND=1
          SINCE=
          if [ -n "$REVIEWED" ]; then
            ROUND=${LAST_ROUND:-1}
            if [ "$REVIEWED" = "$HEAD_SHA" ]; then
              MODE=unchanged
            elif is_ancestor && only_clean_base_merges; then
              MODE=unchanged # base 머지만 있는 push
            elif git cat-file -e "$REVIEWED^{commit}" 2>/dev/null && [ "$(patch_id "$REVIEWED")" = "$(patch_id "$HEAD_SHA")" ]; then
              MODE=unchanged # 내용이 같은 rebase
            else
              ROUND=$((ROUND + 1))
              if is_ancestor; then
                SINCE=$REVIEWED
                write_new_changes > .pr-bot/new-changes.diff
              fi
            fi
          fi

          MARK_ROUND=$ROUND
          MARK_REVIEWED=$HEAD_SHA
          BASE_ONLY=false
          if [ "$MODE" = unchanged ] && [ "$REVIEWED" != "$HEAD_SHA" ]; then
            BASE_ONLY=true
          fi
          if [ "$MODE" = review ] && [ "$ROUND" -gt "$LIMIT" ]; then
            MODE=cap
            MARK_ROUND=$((ROUND - 1))
            MARK_REVIEWED=$REVIEWED
          fi

          ARGS="$PR --post --round $ROUND"
          [ -n "$SINCE" ] && ARGS="$ARGS --since $SINCE"
          {
            echo "mode=$MODE"
            echo "round=$ROUND"
            echo "args=$ARGS"
            echo "comment_id=$COMMENT_ID"
            echo "limit=$LIMIT"
            echo "mark_round=$MARK_ROUND"
            echo "mark_reviewed=$MARK_REVIEWED"
            echo "base_only=$BASE_ONLY"
          } >> "$GITHUB_OUTPUT"

      - name: Review with primary model
        id: primary
        if: steps.state.outputs.mode == 'review'
        continue-on-error: true
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allow_fork_prs: "false"
          include_fix_links: "false"
          prompt: |
            `.pr-bot/instructions.md`를 읽고 그 지침대로 리뷰한다.
            인라인 지적은 PR에 직접 올리지 않고 구조화 결과의 `comments`에 담는다(`path`, PR diff 새 쪽의 `line`, `body`). 워크플로가 모아서 리뷰 하나로 올린다. 지침이 이와 다르면 이 안내를 따른다.
            인자: ${{ steps.state.outputs.args }}
          claude_args: >-
            --model ${{ env.PRIMARY_MODEL }}
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*)"
            --json-schema '{"type":"object","properties":{"p0":{"type":"integer"},"p1":{"type":"integer"},"p2":{"type":"integer"},"human":{"type":"integer"},"comments":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"}},"required":["path","line","body"]}},"summary":{"type":"string"}},"required":["p0","p1","p2","human","comments","summary"]}'

      # 사용량 제한은 --fallback-model이 처리하지 않으므로 실패하면 다른 모델로 다시 돌린다.
      - name: Review with fallback model
        id: fallback
        if: steps.state.outputs.mode == 'review' && (steps.primary.outcome != 'success' || steps.primary.outputs.structured_output == '')
        continue-on-error: true
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allow_fork_prs: "false"
          include_fix_links: "false"
          prompt: |
            `.pr-bot/instructions.md`를 읽고 그 지침대로 리뷰한다.
            인라인 지적은 PR에 직접 올리지 않고 구조화 결과의 `comments`에 담는다(`path`, PR diff 새 쪽의 `line`, `body`). 워크플로가 모아서 리뷰 하나로 올린다. 지침이 이와 다르면 이 안내를 따른다.
            인자: ${{ steps.state.outputs.args }}
          claude_args: >-
            --model ${{ env.FALLBACK_MODEL }}
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*)"
            --json-schema '{"type":"object","properties":{"p0":{"type":"integer"},"p1":{"type":"integer"},"p2":{"type":"integer"},"human":{"type":"integer"},"comments":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"}},"required":["path","line","body"]}},"summary":{"type":"string"}},"required":["p0","p1","p2","human","comments","summary"]}'

      - name: Publish result
        env:
          MODE: ${{ steps.state.outputs.mode }}
          ROUND: ${{ steps.state.outputs.round }}
          LIMIT: ${{ steps.state.outputs.limit }}
          MARK_ROUND: ${{ steps.state.outputs.mark_round }}
          MARK_REVIEWED: ${{ steps.state.outputs.mark_reviewed }}
          BASE_ONLY: ${{ steps.state.outputs.base_only }}
          COMMENT_ID: ${{ steps.state.outputs.comment_id }}
          PRIMARY_OUTPUT: ${{ steps.primary.outputs.structured_output }}
          FALLBACK_OUTPUT: ${{ steps.fallback.outputs.structured_output }}
        run: |
          set -euo pipefail
          MARK="<!-- pr-bot:summary head=$HEAD_SHA reviewed=$MARK_REVIEWED round=$MARK_ROUND -->"

          upsert() {
            if [ -n "$COMMENT_ID" ]; then
              jq -n --arg body "$1" '{body:$body}' | gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" --input - >/dev/null
            else
              jq -n --arg body "$1" '{body:$body}' | gh api "repos/$REPO/issues/$PR/comments" --input - >/dev/null
            fi
          }

          # 지적을 리뷰 하나로 올린다. 줄이 diff에 없어 거부되면 하나씩 올리고, 그래도 안 되면 파일 단위,
          # 그다음 diff의 첫 파일에 올려 모든 지적이 닫을 수 있는 스레드가 되게 한다.
          # 끝내 올리지 못한 지적은 표준 출력으로 돌려줘 요약에 넣는다.
          post_review() {
            local comments=$1 n i c
            # 실행마다 다른 표식으로 이 실행이 만든 리뷰만 알아본다(재실행은 attempt가 바뀐다).
            local run_tag="<!-- pr-bot:run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} -->"
            n=$(jq length <<<"$comments")
            [ "$n" -gt 0 ] || return 0
            local body
            body=$(printf 'PR 봇 라운드 %s: 인라인 지적 %s개. 요약은 PR 봇 코멘트에 있습니다.\n\n%s' "$ROUND" "$n" "$run_tag")
            if jq -n --arg sha "$HEAD_SHA" --arg body "$body" --argjson c "$comments" \
                '{commit_id:$sha, event:"COMMENT", body:$body, comments:[$c[] | {path, line, side:"RIGHT", body}]}' \
                | gh api "repos/$REPO/pulls/$PR/reviews" --input - >/dev/null; then
              return 0
            fi
            # 이 실행의 리뷰가 만들어졌는데 응답만 실패했으면 다시 올리지 않는다.
            if gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq '.[].body' | grep -qF "$run_tag"; then
              return 0
            fi
            echo "::warning::지적을 리뷰 하나로 올리지 못해 하나씩 올립니다." >&2
            local first
            first=$(gh pr diff "$PR" --repo "$REPO" --name-only | sed -n '1p') || first=
            for i in $(seq 0 $((n - 1))); do
              c=$(jq -c ".[$i]" <<<"$comments")
              jq -n --arg sha "$HEAD_SHA" --argjson c "$c" '{commit_id:$sha, path:$c.path, line:$c.line, side:"RIGHT", body:$c.body}' \
                | gh api "repos/$REPO/pulls/$PR/comments" --input - >/dev/null && continue
              jq -n --arg sha "$HEAD_SHA" --argjson c "$c" '{commit_id:$sha, path:$c.path, subject_type:"file", body:$c.body}' \
                | gh api "repos/$REPO/pulls/$PR/comments" --input - >/dev/null && continue
              if [ -n "$first" ]; then
                jq -n --arg sha "$HEAD_SHA" --arg first "$first" --argjson c "$c" \
                  '{commit_id:$sha, path:$first, subject_type:"file", body:"\($c.body)\n\n(원래 위치: `\($c.path):\($c.line)`)"}' \
                  | gh api "repos/$REPO/pulls/$PR/comments" --input - >/dev/null && continue
              fi
              jq -r '"- `\(.path):\(.line)` \(.body | gsub("\n+"; " "))"' <<<"$c"
            done
          }

          case "$MODE" in
            unchanged)
              if [ -n "$COMMENT_ID" ]; then
                OLD=$(gh api "repos/$REPO/issues/comments/$COMMENT_ID" --jq .body)
                BODY=$(tail -n +2 <<<"$OLD")
                if [ "$BASE_ONLY" = true ]; then
                  BODY=$(sed -E "\$s/head \`[0-9a-f]{7}\`( \([^)]*\))?/head \`${HEAD_SHA:0:7}\` (base 머지만 반영, 합친 동작은 미확인)/" <<<"$BODY")
                fi
                upsert "$(printf '%s\n%s' "$MARK" "$BODY")"
              fi
              echo "PR의 변경이 그대로여서 이전 리뷰를 유지합니다. base와 합친 동작은 이 봇이 확인하지 않습니다."
              ;;
            cap)
              OPEN=$(jq '[.[] | select((.isResolved | not) and (.comments.nodes[0].body | startswith("**[사람 확인 필요]** 리뷰 라운드 상한")))] | length' .pr-bot/threads.json)
              if [ "$OPEN" -eq 0 ]; then
                FILE=$(gh pr diff "$PR" --repo "$REPO" --name-only | sed -n '1p')
                gh api "repos/$REPO/pulls/$PR/comments" \
                  -f body="**[사람 확인 필요]** 리뷰 라운드 상한(${LIMIT}회)을 넘었습니다. 고치는 방식 자체를 다시 검토해 주세요. 이 스레드를 닫으면 3라운드를 더 쓸 수 있습니다. 이 head는 리뷰되지 않아 체크가 실패합니다. 닫은 뒤 pr-bot을 다시 실행하거나 새로 push해 주세요." \
                  -f commit_id="$HEAD_SHA" -f path="$FILE" -f subject_type=file >/dev/null
              fi
              upsert "$(printf '%s\n## PR 봇\n\n라운드 상한(%s회)을 넘어 이 head(`%s`)는 자동 리뷰하지 않았고 이 체크는 실패합니다. 상한 스레드를 닫은 뒤 pr-bot을 다시 실행하거나 새로 push하면 3라운드를 더 리뷰합니다.' "$MARK" "$LIMIT" "${HEAD_SHA:0:7}")"
              # 리뷰하지 않은 head가 필수 체크를 통과하지 못하게 한다.
              echo "::error::리뷰 라운드 상한(${LIMIT}회)을 넘었습니다. 상한 스레드를 닫은 뒤 pr-bot을 다시 실행하세요."
              exit 1
              ;;
            review)
              OUTPUT=$PRIMARY_OUTPUT
              MODEL=$PRIMARY_MODEL
              if [ -z "$OUTPUT" ]; then
                OUTPUT=$FALLBACK_OUTPUT
                MODEL="$FALLBACK_MODEL (전환됨)"
              fi
              if [ -z "$OUTPUT" ]; then
                echo "::error::두 모델 모두 리뷰 결과를 내지 못했습니다. 사용량 한도나 토큰을 확인하세요."
                exit 1
              fi
              HEADER=$(jq -r '"PR 봇: 0단계 \(.p0) · 1단계 \(.p1) · 2단계 \(.p2) · 사람 확인 \(.human)"' <<<"$OUTPUT")
              SUMMARY=$(jq -r .summary <<<"$OUTPUT")
              # 지적을 리뷰 하나로 묶어 올려 알림이 라운드마다 한 번만 가게 한다.
              COMMENTS=$(jq -c '.comments // []' <<<"$OUTPUT")
              UNPOSTED=$(post_review "$COMMENTS")
              if [ -n "$UNPOSTED" ]; then
                SUMMARY=$(printf '%s\n\n### 인라인으로 올리지 못한 지적\n\n%s' "$SUMMARY" "$UNPOSTED")
              fi
              upsert "$(printf '%s\n## %s\n\n%s\n\n---\n라운드 %s/%s · 모델 %s · head `%s`' "$MARK" "$HEADER" "$SUMMARY" "$ROUND" "$LIMIT" "$MODEL" "${HEAD_SHA:0:7}")"
              ;;
          esac
